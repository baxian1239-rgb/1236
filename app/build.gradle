plugins { id 'com.android.application' }
def cloudUrl = providers.environmentVariable('MINDOS_CLOUD_URL').orElse('https://ql.school/mindos').get()
if (cloudUrl && !(cloudUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9_-]+)*/)) {
    throw new GradleException('MINDOS_CLOUD_URL must be an HTTPS base URL without a trailing slash')
}
android {
    namespace 'com.quanlu.mindos'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.quanlu.mindos'
        minSdk 26
        targetSdk 35
        versionCode 5
        buildConfigField 'String', 'CLOUD_URL', '"' + cloudUrl + '"'
        versionName '0.3.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



